server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
